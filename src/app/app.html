<!-- Login page: full screen without sidebar -->
<ng-container *ngIf="isLoginRoute()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Main layout with sidebar -->
<div *ngIf="!isLoginRoute()" class="flex min-h-screen">
  <!-- Sidebar Overlay -->
  <div
    *ngIf="sidebarOpen"
    (click)="sidebarOpen = false"
    class="fixed inset-0 bg-black/50 z-40 transition-opacity"></div>

  <!-- Sidebar -->
  <aside
    [class]="isDarkMode() ? 'w-64 md:w-72 lg:w-80 bg-white/10 backdrop-blur-lg text-white p-4 md:p-6 fixed md:static shadow-2xl border-r border-white/20 h-screen md:h-auto overflow-y-auto z-50 md:z-auto' : 'w-64 md:w-72 lg:w-80 bg-white backdrop-blur-lg text-black p-4 md:p-6 fixed md:static shadow-2xl border-r border-yellow-500 h-screen md:h-auto overflow-y-auto z-50 md:z-auto'"
    [style.transform]="isMobileMode() ? (sidebarOpen ? 'translateX(0)' : 'translateX(-100%)') : 'translateX(0)'"
    [style.transition]="'transform 0.3s ease-in-out'">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-2xl font-bold">Lang Group Co., LTD.</h2>
        <h3 [class]="isDarkMode() ? 'text-lg text-red-100' : 'text-lg text-red-600'">แลงกรุ๊ป จำกัด.</h3>
      </div>
      <!-- Close button (Mobile only) -->
      <button *ngIf="isMobileMode()" (click)="sidebarOpen = false" [class]="isDarkMode() ? 'text-white hover:bg-white/20 p-2 rounded-lg transition-colors' : 'text-black hover:bg-red-100 p-2 rounded-lg transition-colors'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <nav>
      <ul class="space-y-3">
        @for (menu of allowedMenus(); track menu.route) {
          <li>
            <a [routerLink]="menu.route" (click)="sidebarOpen = false"
               [class]="isDarkMode() ? 'sidebar-link p-3 rounded-lg hover:bg-white/20 transition-all duration-300 flex items-center space-x-3' : 'sidebar-link p-3 rounded-lg hover:bg-red-50 transition-all duration-300 flex items-center space-x-3'">
              <span>{{ menu.icon }}</span><span>{{ menu.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- User info -->
    <div [class]="isDarkMode() ? 'mt-auto pt-6 border-t border-white/20 space-y-3' : 'mt-auto pt-6 border-t border-yellow-500 space-y-3'" style="margin-top: 2rem">
      <div *ngIf="auth.currentUser()" [class]="isDarkMode() ? 'px-3 py-2 rounded-lg bg-white/10 text-sm' : 'px-3 py-2 rounded-lg bg-yellow-50 text-sm'">
        <p [class]="isDarkMode() ? 'text-blue-200 text-xs' : 'text-blue-600 text-xs'">ผู้ใช้งาน</p>
        <p [class]="isDarkMode() ? 'text-white font-medium truncate' : 'text-black font-medium truncate'">{{ auth.currentUser()?.USERNAME }}</p>
      </div>
      <!-- Dark Mode Toggle -->
      <button (click)="toggleDarkMode()" [class]="isDarkMode() ? 'w-full p-3 rounded-lg bg-white/20 hover:bg-white/30 transition-all duration-300 flex items-center justify-center space-x-2' : 'w-full p-3 rounded-lg bg-red-100 hover:bg-red-200 transition-all duration-300 flex items-center justify-center space-x-2'">
        <span>{{ isDarkMode() ? '☀️' : '🌙' }}</span>
        <span>{{ isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
      </button>
      <!-- Logout -->
      <button (click)="sidebarOpen = false; auth.logout()" [class]="isDarkMode() ? 'w-full p-3 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-200 hover:text-white transition-all duration-300 flex items-center justify-center space-x-2' : 'w-full p-3 rounded-lg bg-red-100 hover:bg-red-200 text-red-600 hover:text-red-800 transition-all duration-300 flex items-center justify-center space-x-2'">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>ออกจากระบบ</span>
      </button>
    </div>
  </aside>

  <!-- Content -->
  <div class="flex-1 flex flex-col">
    <!-- Top bar -->
    <header [class]="isDarkMode() ? 'bg-white/10 backdrop-blur-lg p-4 flex items-center shadow-lg border-b border-white/20' : 'bg-white backdrop-blur-lg p-4 flex items-center shadow-lg border-b border-yellow-500'" [class.md:hidden]="!isMobileMode()">
      <button (click)="sidebarOpen = !sidebarOpen" [class]="isDarkMode() ? 'text-white hover:bg-white/20 p-2 rounded-lg transition-colors' : 'text-black hover:bg-red-100 p-2 rounded-lg transition-colors'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <h1 [class]="isDarkMode() ? 'ml-4 font-bold text-xl text-white' : 'ml-4 font-bold text-xl text-black'">แลงกรุ๊ป จำกัด</h1>
      <button (click)="toggleDarkMode()" [class]="isDarkMode() ? 'ml-auto text-white hover:bg-white/20 p-2 rounded-lg transition-colors' : 'ml-auto text-black hover:bg-red-100 p-2 rounded-lg transition-colors'">
        <span>{{ isDarkMode() ? '☀️' : '🌙' }}</span>
      </button>
    </header>

    <!-- Main content -->
    <main class="p-4 sm:p-6 md:p-8 flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
