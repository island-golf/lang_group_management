<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside
    [class.hidden]="!sidebarOpen"
    class="w-64 bg-gray-800 text-white p-4 hidden md:block">
    <h2 class="text-xl font-bold">Lang Group Co., LTD.</h2>
    <h3 class="text-l mb-6 text-gray-300">แลงกรุ๊ป จำกัด.</h3>
    <nav>
      <ul class="space-y-2">
        <li><a routerLink="/" class="block p-2 rounded hover:bg-gray-700">🏠 Home</a></li>
        <li><a routerLink="/dashboard" class="block p-2 rounded hover:bg-gray-700">⚙️ Dashboard</a></li>
        <li><a routerLink="/kaokang-inventory" class="block p-2 rounded hover:bg-gray-700">📊 Kaokang</a></li>
      </ul>
    </nav>
  </aside>

  <!-- Content -->
  <div class="flex-1 flex flex-col">
    <!-- Top bar -->
    <header class="bg-gray-100 p-4 flex items-center md:hidden">
      <button (click)="sidebarOpen = !sidebarOpen" class="text-gray-800">
        <!-- Hamburger icon -->
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <h1 class="ml-4 font-bold text-lg">แลงกรุ๊ป จำกัด</h1>
    </header>

    <!-- Main content -->
    <main class="p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
