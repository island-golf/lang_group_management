<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 via-blue-900 to-slate-900 p-4">
  <div class="w-full max-w-md">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="mx-auto mb-4 w-32 h-32 rounded-2xl overflow-hidden border border-white/20 shadow-lg bg-white">
          <img
            ngSrc="assets/images/Logo.jpg"
            alt="Lang Group Logo"
            width="128"
            height="128"
            class="w-full h-full object-contain" />
        </div>
        <h1 class="text-2xl font-bold text-white">Lang Group Co., LTD.</h1>
        <p class="text-blue-200 text-sm mt-1">แลงกรุ๊ป จำกัด</p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()">
        <!-- Username -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-blue-100 mb-2">ชื่อผู้ใช้</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-blue-300">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              [(ngModel)]="username"
              name="username"
              placeholder="กรอกชื่อผู้ใช้"
              autocomplete="username"
              [disabled]="loading()"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300/60 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all disabled:opacity-50" />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-blue-100 mb-2">รหัสผ่าน</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-blue-300">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.657 0 3-1.343 3-3S13.657 5 12 5s-3 1.343-3 3 1.343 3 3 3z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 20h14a2 2 0 002-2v-3a4 4 0 00-4-4H7a4 4 0 00-4 4v3a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="กรอกรหัสผ่าน"
              autocomplete="current-password"
              [disabled]="loading()"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-blue-300/60 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all disabled:opacity-50" />
          </div>
        </div>

        <!-- Error message -->
        <div *ngIf="errorMessage()" class="mb-4 px-4 py-3 rounded-xl bg-red-500/20 border border-red-400/40 text-red-200 text-sm flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          {{ errorMessage() }}
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold transition-all duration-200 shadow-lg shadow-blue-500/30 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <svg *ngIf="loading()" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ loading() ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ' }}
        </button>
      </form>
    </div>
  </div>
</div>
