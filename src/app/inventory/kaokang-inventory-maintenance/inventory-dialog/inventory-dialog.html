<div class="p-6">
  <h2 mat-dialog-title class="text-xl font-bold mb-4 text-white">{{ data.title }}</h2>

  <form [formGroup]="inventoryForm" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Item Description -->
      <div class="md:col-span-3">
        <label class="block text-sm font-medium text-gray-300 mb-2">ชื่อสินค้า *</label>
        <input
          formControlName="item_desc"
          type="text"
          placeholder="กรอกชื่อสินค้า"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
        @if (inventoryForm.get('item_desc')?.hasError('required')) {
          <p class="text-red-400 text-sm mt-1">กรุณากรอกชื่อสินค้า</p>
        }
      </div>

      <!-- Default Amount -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">จำนวนเริ่มต้น</label>
        <input
          formControlName="default_amount"
          type="number"
          placeholder="0"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
        @if (inventoryForm.get('default_amount')?.hasError('min')) {
          <p class="text-red-400 text-sm mt-1">จำนวนต้องไม่น้อยกว่า 0</p>
        }
      </div>

      <!-- Unit -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">หน่วย</label>
        <input
          formControlName="unit"
          type="text"
          placeholder="เช่น ชิ้น, กิโล, ลิตร"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
      </div>

      <!-- Vendor Group -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">กลุ่มผู้ขาย</label>
        <input
          formControlName="vendor_group"
          type="text"
          placeholder="เช่น วิน, แมคโคร, กะทิ"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
      </div>

      <!-- Item Group -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">กลุ่มสินค้า</label>
        <input
          formControlName="item_group"
          type="text"
          placeholder="กรอกกลุ่มสินค้า"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
      </div>

      <!-- Sequence -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">ลำดับที่</label>
        <input
          formControlName="seq"
          type="number"
          placeholder="0"
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
        @if (inventoryForm.get('seq')?.hasError('min')) {
          <p class="text-red-400 text-sm mt-1">ลำดับต้องไม่น้อยกว่า 0</p>
        }
      </div>

      <!-- Active Status -->
      <div class="flex items-center space-x-2 md:col-span-3">
        <mat-checkbox formControlName="is_active_yn" value="Y" class="text-white">
          ใช้งาน
        </mat-checkbox>
      </div>
    </div>

    <div class="flex justify-end space-x-3 pt-4">
      <button
        mat-button
        type="button"
        (click)="onCancel()"
        class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-medium transition-colors">
        ยกเลิก
      </button>
      <button
        mat-raised-button
        type="button"
        (click)="onSave()"
        [disabled]="inventoryForm.invalid"
        class="px-6 py-2 !bg-red-600 !hover:bg-red-700 text-white rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        {{ data.item ? 'อัพเดต' : 'เพิ่มรายการ' }}
      </button>
    </div>
  </form>
</div>
