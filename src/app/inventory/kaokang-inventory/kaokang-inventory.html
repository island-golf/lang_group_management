<!-- Success Dialog -->
@if (showSuccess) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="success-dialog bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-10 flex flex-col items-center gap-4">
      <svg class="w-24 h-24 text-green-500" viewBox="0 0 52 52">
        <circle class="circle-anim" cx="26" cy="26" r="25" fill="none" stroke="currentColor" stroke-width="2"/>
        <path class="check-anim" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          d="M14 27 l8 8 l16-16"/>
      </svg>
      <p class="text-2xl font-bold text-gray-800 dark:text-white">บันทึกสำเร็จ</p>
    </div>
  </div>
}

<div class="flex-1 flex flex-col fade-in">
  <header
    class="bg-gradient-to-r from-red-600 via-red-500 to-red-400 shadow-2xl px-4 sm:px-6 py-6 sm:py-8 flex flex-col items-start rounded-2xl text-white">
    <h1 class="text-2xl sm:text-3xl font-bold mb-2">ระบบนับสต็อกข้าวแกงยายแลง</h1>
    <h3 class="text-lg sm:text-xl font-semibold text-red-200">Kaokang Inventory</h3>
  </header>
  <section class="mt-8 sm:mt-12 max-w-sm sm:max-w-md lg:max-w-lg mx-auto px-4 sm:px-0">
    <mat-card class="p-6 sm:p-8 hover:shadow-2xl transition-shadow duration-300">
      <div class="flex flex-col sm:flex-row items-start mb-4 sm:mb-6">
        <h3 class="text-lg sm:text-xl mb-2 sm:mb-4">รายการวันที่ : &nbsp;</h3>
        <h3 class="text-lg sm:text-xl mb-4 text-red-400 font-bold">{{ getThaiDate() }}</h3>
      </div>
      <form [formGroup]="formGroup" (ngSubmit)="submit()">
        <div formArrayName="inventories" class="space-y-3 sm:space-y-4">
          @for (inv of inventories.controls; track inv.value.tran_id) {
            <div [formGroupName]="inventories.controls.indexOf(inv)" class="inventory-item p-3 sm:p-4 rounded-lg transition-colors">
              <label class="block text-sm font-medium text-gray-300 mb-2">{{ inv.value.item_desc }}</label>
              <input
                formControlName="amount"
                type="number"
                [readonly]="isReadonly"
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
            </div>
          }
        </div>

        <div class="mt-6 sm:mt-8 p-3 sm:p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded-r-lg">
          <label class="text-yellow-800 font-medium text-sm sm:text-base">*กรุณาตรวจสอบข้อมูลให้ดี สามารถกดบันทึกได้ครั้งเดียวต่อวัน หลังจากกดบันทึกแล้วจะไม่สามารถแก้ไขได้</label>
        </div>
        <div class="flex justify-center mt-6 sm:mt-8">
          <button mat-raised-button color="primary"
                  type="submit"
                  class="w-full py-3 sm:py-4 text-base sm:text-lg font-bold hover:scale-105 transition-transform duration-300 shadow-lg"
                  [disabled]="isReadonly">
            บันทึก
          </button>
        </div>
      </form>
    </mat-card>
  </section>
</div>
