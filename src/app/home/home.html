<div class="space-y-6">
  <div class="bg-white/10 backdrop-blur-lg rounded-2xl border border-white/20 p-6 shadow-xl">
    <h1 class="text-3xl font-bold text-white mb-1">ยินดีต้อนรับ</h1>
    <p class="text-blue-200">
      สวัสดี,
      <span class="font-semibold text-white">{{ auth.currentUser()?.USERNAME }}</span>
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (menu of permittedMenus; track menu.route) {
      <a [routerLink]="menu.route"
         class="bg-white/10 hover:bg-white/20 backdrop-blur-lg rounded-2xl border border-white/20 p-6 shadow-xl transition-all duration-300 cursor-pointer block">
        <div class="text-3xl mb-3">{{ menu.icon }}</div>
        <h3 class="text-lg font-semibold text-white">{{ menu.label }}</h3>
        <p class="text-blue-200 text-sm mt-1">คลิกเพื่อเข้าใช้งาน</p>
      </a>
    }
  </div>
</div>
